<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cargas — Logística Express</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="conteudo">
  <h1>Cargas</h1>
  <div id="mensagem" role="alert" aria-live="polite" class="msg"></div>

  <section class="card" aria-labelledby="t-form">
    <h2 id="t-form">Nova carga</h2>
    <form id="form" novalidate>
      <input type="hidden" id="cod">
      <div class="form-grid">
        <div><label for="descricao">Descrição</label><input id="descricao" maxlength="100" required></div>
        <div><label for="peso">Peso (kg)</label><input id="peso" type="number" step="0.01" min="0.01" required></div>
        <div><label for="volume">Volume (m³)</label><input id="volume" type="number" step="0.001" min="0.001" required></div>
        <div><label for="codigoRastreio">Código de rastreio (11 dígitos)</label><input id="codigoRastreio" inputmode="numeric" maxlength="11" required></div>
        <div><label for="codigoMotorista">Motorista</label><select id="codigoMotorista" required><option value="">Selecione…</option></select></div>
      </div>
      <div class="acoes">
        <button class="btn" type="submit" id="btn-salvar">Cadastrar</button>
        <button class="btn sec" type="button" id="btn-cancelar" hidden>Cancelar edição</button>
      </div>
    </form>
  </section>

  <section class="card" aria-labelledby="t-lista">
    <h2 id="t-lista">Cargas cadastradas</h2>
    <div id="tabela" class="tabela-wrap"></div>
  </section>
</main>
<script src="js/common.js"></script>
<script src="js/cargas.js"></script>
</body>
</html>
