<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — Logística Express</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="login-box" id="conteudo">
  <div class="card">
    <h1>🚚 Logística Express</h1>
    <p class="mut">Sistema interno de gestão e rastreamento de encomendas. Acesso restrito a funcionários.</p>
    <div id="mensagem" role="alert" aria-live="assertive" class="msg"></div>
    <form id="form-login" novalidate>
      <div class="campo"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="username" required></div>
      <div class="campo"><label for="senha">Senha</label><input id="senha" name="senha" type="password" autocomplete="current-password" required></div>
      <button class="btn" type="submit">Entrar</button>
    </form>
  </div>
</main>
<script src="js/common.js"></script>
<script src="js/login.js"></script>
</body>
</html>
